name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token. Nothing here writes to the repository, and when release.yml
# calls this workflow the called side can only lower the caller's permissions,
# so the CI gate never holds the release job's contents: write.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA (a tag can be moved);
      # the comment names the release the SHA was taken from. persist-credentials
      # false keeps the token out of .git/config, where the curl | sh installer
      # below could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        # The toolchain version is the cyrius.cyml [package].cyrius pin — the
        # single source of truth, never hardcoded here. Hand it to the upstream
        # install.sh, which lays out $HOME/.cyrius/{bin,lib,versions/<v>}. The
        # hand-rolled curl+cp-into-bin form is deliberately avoided: it skips
        # versions/<v>/ and so fails the `cyrius deps` pin-check.
        # Reference: patra / sigil.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps
        run: cyrius deps

      - name: Format check
        run: |
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr; do
            cyrius fmt "$f" --check
          done

      - name: Lint
        # Hard gate: any warning fails, in src/ and tests/. Through cyrius 6.6.12
        # cyrlint counted bytes, so src/rng.cyr's box-drawing NOT-A-CSPRNG banner
        # read as over 120 columns and this gate let that one warning through.
        # Since 6.6.13 it counts code points, the banner is clean, and nothing
        # is tolerated.
        run: |
          fail=0
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr; do
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            if echo "$out" | grep -qE '^[[:space:]]*(warn|error) '; then
              echo "lint: warnings in $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Vet
        # cyaudit vet: every file the smoke entry includes resolves, and none is
        # untrusted. Exits 1 on a finding.
        run: cyrius vet src/main.cyr

      - name: Build smoke
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/tyche
          echo "smoke: $(wc -c < build/tyche) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/tyche | grep -q "7f45 4c46"

      - name: Run smoke
        run: ./build/tyche

      - name: Tests
        # `cyrius test tests` recursively runs tests/*.tcyr: tyche's known-answer
        # and statistical suite (tests/tyche.tcyr). The plural `cyrius tests`
        # alias is deprecated from cyrius 6.7.6 and removed at 6.7.12.
        run: cyrius test tests

      - name: Tests + fuzz on aarch64 (qemu-user)
        # The contract is "same seed, same bits on every target", and tests/tyche.tcyr
        # pins exact bit patterns, so the suite has to RUN on a second architecture to
        # test the contract at all. Through 1.0.3 rng_normal differed between x86_64 and
        # aarch64 (f64_ln is x87 on one and a software polyfill on the other) while every
        # x86-only gate stayed green. Fails rather than skips when the aarch64
        # cross-compiler or qemu is missing: a skipped gate here would report green over
        # exactly the property it exists to check.
        run: |
          [ -x "$HOME/.cyrius/bin/cycc_aarch64" ] || {
            echo "::error::cycc_aarch64 not shipped with this Cyrius; cannot test the aarch64 half"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user || sudo apt-get install -y -qq qemu-user-static
          QEMU="$(command -v qemu-aarch64 || command -v qemu-aarch64-static)" || {
            echo "::error::no qemu-aarch64 binary after install"; exit 1; }
          mkdir -p build
          cyrius build --aarch64 tests/tyche.tcyr build/tyche-tcyr-a64
          "$QEMU" build/tyche-tcyr-a64
          CYRIUS_DCE=1 cyrius build --aarch64 tests/tyche.fcyr build/tyche-fuzz-a64
          timeout 120 "$QEMU" build/tyche-fuzz-a64

      - name: Benchmarks
        run: CYRIUS_DCE=1 cyrius bench tests/tyche.bcyr

      - name: Fuzz
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build tests/tyche.fcyr build/tyche-fuzz
          timeout 30 ./build/tyche-fuzz || { echo "FUZZ CRASH"; exit 1; }

      - name: distlib drift check
        # tyche is a LIBRARY: consumers import dist/tyche.cyr (the [lib] bundle),
        # not src/. Regenerate it and fail if the committed bundle is stale, so a
        # release can never ship a dist/ that lags src/rng.cyr. `cyrius distlib`
        # is byte-deterministic, so `git diff --exit-code` is a valid sync gate.
        run: |
          cyrius distlib
          git diff --exit-code dist/ \
            || { echo "FAIL: dist/tyche.cyr is stale — run 'cyrius distlib' and commit."; exit 1; }

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for dangerous patterns
        # Informational. tyche is pure arithmetic — no process/path/exec
        # surface — so these never fire today; kept for parity with sibling lib
        # repos and to catch a future regression.
        run: |
          if grep -rn 'syscall(59' src/ 2>/dev/null | grep -v "# "; then
            echo "WARN: raw execve"
          fi
          if grep -rn '"/etc/' src/ 2>/dev/null; then
            echo "WARN: hardcoded /etc paths"
          fi
          echo "security scan complete"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check required docs
        # Only files that exist in tyche are gated — gating an absent file would
        # falsely red the build. dist/tyche.cyr is required: it is the shipped
        # consumable bundle.
        run: |
          MISSING=0
          for doc in README.md CHANGELOG.md VERSION LICENSE cyrius.cyml dist/tyche.cyr; do
            if [ -f "$doc" ]; then echo "  OK: $doc"; else echo "  MISSING: $doc"; MISSING=1; fi
          done
          exit $MISSING
      - name: Verify version consistency
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # ${file:VERSION} template means cyml derives version from the VERSION
          # file — VERSION is the single source of truth. Resolve the template to
          # the file content for the consistency check.
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          [ "$FILE_VERSION" = "$CYML_VERSION" ] || { echo "VERSION ($FILE_VERSION) != cyrius.cyml ($CYML_RAW)"; exit 1; }
          grep -q "$FILE_VERSION" CHANGELOG.md || { echo "version not in changelog"; exit 1; }
          echo "Version consistent: $FILE_VERSION (cyml: $CYML_RAW)"
